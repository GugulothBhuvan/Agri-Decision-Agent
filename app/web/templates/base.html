<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ s['app.name'] }}{% endblock %}</title>
<meta name="theme-color" content="#2C6649">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700&family=Hind+Siliguri:wght@400;600&family=IBM+Plex+Mono&display=swap">
<link rel="stylesheet" href="/static/styles.css">
<script>
  try { var th = localStorage.getItem("fs-theme"); if (th === "light" || th === "dark") document.documentElement.dataset.theme = th; } catch (e) {}
</script>
</head>
<body data-lang="{{ lang }}" {% block bodyattrs %}{% endblock %}>
<header class="topbar {% block topwide %}{% endblock %}">
  <div class="in">
    <a class="brand" href="/">{{ s['app.name'] }}<span class="dot">.</span></a>
    <span class="farmname">{% block farmname %}{% endblock %}</span>
    <button class="btn-lang" id="lang-switch" type="button" data-to="{{ other }}" lang="{{ other }}">{{ s['lang.switch'] }}</button>
  </div>
</header>
<div class="banner slow" id="net-slow" role="status">{{ s['net.slow'] }}<span class="second">{{ s2['net.slow'] }}</span></div>
<div class="banner offline" id="net-offline" role="status">{{ s['net.offline_short'] }}<span class="second" id="net-offline-detail"></span></div>
<main class="wrap {% block mainwide %}{% endblock %}">
{% block content %}{% endblock %}
</main>
{% block dock %}{% endblock %}
<script>window.FS = {{ {"lang": lang, "strings": strings_json} | tojson }};</script>
<script type="module" src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
