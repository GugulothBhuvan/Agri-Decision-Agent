# Render blueprint: one always-on web service (the scheduler runs in-process, so keep a single instance).
services:
  - type: web
    name: agri-decision-agent
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_SPEAKER
        value: ritu
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: OPS_PASSCODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NOMINATIM_USER_AGENT
        value: agri-decision-agent/0.1 (contact: bhuvanrajnaik@gmail.com)
      - key: SCHEDULE_HOURS
        value: "3"
